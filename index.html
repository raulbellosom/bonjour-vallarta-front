    <!-- Prevent FOUC for theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var isDark =
            t === "dark" ||
            (!t &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
